name: Frontend CI

# checks: install -> lint -> API contract -> types -> architecture -> build.
# deploy: main -> tuttitrip.gburek.app, develop -> tuttitrip-develop.gburek.app,
#         pull requests -> one preview Worker per branch + a PR comment,
#         then delete preview Workers whose branch is gone.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    runs-on: [self-hosted, hackathon]
    timeout-minutes: 15
    outputs:
      api_url: ${{ steps.api.outputs.api_url }}
      api_branch: ${{ steps.api.outputs.api_branch }}
      app_env: ${{ steps.api.outputs.app_env }}
      preview_worker: ${{ steps.api.outputs.preview_worker }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      # The JS build of pnpm: the runner image lacks libatomic, which the
      # standalone binary from pnpm/action-setup needs. The store stays on the
      # self-hosted runner between runs, so no extra cache step.
      - name: Install pnpm (version from packageManager)
        run: npm install --global "$(node -p "require('./package.json').packageManager")"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint and format (Biome)
        run: pnpm biome ci --reporter=github .

      - name: Pick backend API for this branch
        id: api
        run: scripts/resolve-api.sh "${{ github.head_ref || github.ref_name }}" | tee -a "$GITHUB_OUTPUT"

      - name: Sync API contract (openapi.json -> schema.d.ts)
        if: steps.api.outputs.api_live == 'true'
        run: |
          pnpm api:sync --url "${{ steps.api.outputs.api_url }}/openapi.json"
          if ! git diff --quiet -- src/api/schema.d.ts; then
            echo "::warning file=src/api/schema.d.ts::Backend '${{ steps.api.outputs.api_branch }}' changed the API. Run 'pnpm api:sync' locally and commit src/api/schema.d.ts."
            git --no-pager diff --stat -- src/api/schema.d.ts
          fi

      - name: Keep committed API contract
        if: steps.api.outputs.api_live != 'true'
        run: echo "::warning::No backend deployment answered; building against the committed src/api/schema.d.ts."

      - name: Types
        run: pnpm tsc -b

      - name: Architecture tests
        run: pnpm test:arch

      - name: Build
        run: pnpm exec vite build
        env:
          VITE_API_URL: ${{ steps.api.outputs.api_url }}
          VITE_APP_ENV: ${{ steps.api.outputs.app_env }}
          VITE_AUTH0_DOMAIN: ${{ vars.AUTH0_DOMAIN }}
          VITE_AUTH0_CLIENT_ID: ${{ vars.AUTH0_CLIENT_ID }}
          VITE_AUTH0_AUDIENCE: ${{ vars.AUTH0_AUDIENCE }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist
          retention-days: 3

  deploy:
    name: deploy
    needs: checks
    # Pushes to main/develop deploy; pull requests from this repo get a preview.
    if: >-
      (github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'develop')) ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, hackathon]
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      GH_TOKEN: ${{ github.token }}
      PREVIEW_WORKER: ${{ needs.checks.outputs.preview_worker }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      # The JS build of pnpm: the runner image lacks libatomic, which the
      # standalone binary from pnpm/action-setup needs. The store stays on the
      # self-hosted runner between runs, so no extra cache step.
      - name: Install pnpm (version from packageManager)
        run: npm install --global "$(node -p "require('./package.json').packageManager")"
      - name: Install
        run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      - name: Check Cloudflare credentials
        id: creds
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN secret or CLOUDFLARE_ACCOUNT_ID variable missing, skipping deploy."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Pick wrangler command
        id: cmd
        if: steps.creds.outputs.ok == 'true'
        run: |
          case "${{ github.event_name }}/${{ github.ref_name }}" in
            push/main) echo "command=deploy" >> "$GITHUB_OUTPUT"
                       echo "url=https://tuttitrip.gburek.app" >> "$GITHUB_OUTPUT" ;;
            push/develop) echo "command=deploy --env develop" >> "$GITHUB_OUTPUT"
                          echo "url=https://tuttitrip-develop.gburek.app" >> "$GITHUB_OUTPUT" ;;
            *) echo "command=deploy --env preview --name $PREVIEW_WORKER" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Make sure the custom domain is ours to deploy
        if: steps.creds.outputs.ok == 'true' && github.event_name == 'push'
        run: |
          case "${{ github.ref_name }}" in
            main) node scripts/check-custom-domain.mjs tuttitrip-frontend tuttitrip.gburek.app ;;
            develop) node scripts/check-custom-domain.mjs tuttitrip-frontend-develop tuttitrip-develop.gburek.app ;;
          esac

      - name: Deploy to Cloudflare Workers
        id: wrangler
        if: steps.creds.outputs.ok == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
          command: ${{ steps.cmd.outputs.command }} --message "${{ github.sha }}"

      - name: Attach the preview domain
        if: steps.creds.outputs.ok == 'true' && github.event_name == 'pull_request'
        run: node scripts/attach-domain.mjs "$PREVIEW_WORKER" "$PREVIEW_WORKER.gburek.app"

      - name: Deployment URL
        id: url
        if: steps.creds.outputs.ok == 'true'
        run: echo "url=${{ steps.cmd.outputs.url || format('https://{0}.gburek.app', needs.checks.outputs.preview_worker) }}" >> "$GITHUB_OUTPUT"

      - name: Smoke test (app shell + SPA deep link)
        if: steps.creds.outputs.ok == 'true'
        run: |
          url="${{ steps.url.outputs.url }}"
          for _ in $(seq 20); do
            if curl -fsS "$url/" | grep -q '<div id="root">' && curl -fsS "$url/trips?sort=name" | grep -q '<div id="root">'; then
              echo "OK: $url"; exit 0
            fi
            sleep 6
          done
          echo "::error::$url did not serve the app"; exit 1

      - name: Comment preview URL on the PR
        if: steps.creds.outputs.ok == 'true' && github.event_name == 'pull_request'
        run: |
          cat > "$RUNNER_TEMP/comment.md" <<MD
          ### Podgląd: ${{ steps.url.outputs.url }}

          | | |
          | --- | --- |
          | Commit | \`${{ github.event.pull_request.head.sha }}\` |
          | Worker | \`$PREVIEW_WORKER\` |
          | API | ${{ needs.checks.outputs.api_url }} (backend \`${{ needs.checks.outputs.api_branch }}\`) |

          Podgląd zniknie automatycznie po usunięciu gałęzi.
          MD
          node scripts/pr-comment.mjs --pr "${{ github.event.pull_request.number }}" --body "$RUNNER_TEMP/comment.md"

      - name: Explain the missing preview on the PR
        if: steps.creds.outputs.ok != 'true' && github.event_name == 'pull_request'
        run: |
          printf '### Podgląd niedostępny\n\nCI nie ma danych dostępowych do Cloudflare (sekret `CLOUDFLARE_API_TOKEN` albo zmienna `CLOUDFLARE_ACCOUNT_ID`), więc nie wdrożył `%s`. Build i testy przeszły.\n' \
            "$PREVIEW_WORKER" > "$RUNNER_TEMP/comment.md"
          node scripts/pr-comment.mjs --pr "${{ github.event.pull_request.number }}" --body "$RUNNER_TEMP/comment.md"

      - name: Delete previews of deleted branches
        if: steps.creds.outputs.ok == 'true'
        run: node scripts/cleanup-previews.mjs
