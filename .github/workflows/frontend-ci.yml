name: Frontend CI

# CI gates lint, types, architecture and unit tests only (verify). Integration tests
# (`*.int.test.*`, e.g. the production-build leak check) run locally before the PR:
# `pnpm test:integration`, see AGENTS.md.
# build (vite build + dist artifact) feeds a deploy, so it runs only when a deploy
# will happen (develop/main, or a PR with the `preview` label), in parallel with verify.
# Consequence: a plain PR has no `vite build` on CI (plugin, Rollup and PWA errors are not
# caught there), so `pnpm build` and `pnpm test:integration` are part of the local pre-PR checks.
# deploy: main -> tuttitrip.gburek.app, develop -> tuttitrip-develop.gburek.app,
#         pull requests -> one preview Worker per branch + a PR comment,
#         then delete preview Workers whose branch is gone.
# One run per commit: pull_request for branches (the preview is deployed from
# it), push only for main and develop. A newer commit on the same pull request
# cancels the unfinished run; main/develop runs are never cancelled.
# PR previews are off unless the org variable PREVIEW_DEPLOYS is 'true' or the PR
# has the label `preview`; adding that label re-runs the workflow to deploy it.
on:
  push:
    branches: [main, develop]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Other labels (type:* from the autolabeler) get their own group, so they never
  # cancel the run of a real commit.
  group: frontend-ci-${{ github.event.pull_request.number || github.ref }}${{ github.event.action == 'labeled' && github.event.label.name != 'preview' && '-label' || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# CI_SKIP_CHECKS (org variable): 'true' skips lint, tests and contract checks everywhere
# except main, so the self-hosted runners only build and deploy. Temporary, for the
# hackathon finish; set it back to 'false' (or delete it) to restore full CI.
jobs:
  verify:
    name: verify
    if: (github.event.action != 'labeled' || github.event.label.name == 'preview') && (vars.CI_SKIP_CHECKS != 'true' || github.ref == 'refs/heads/main')
    runs-on: [self-hosted, hackathon]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      # The JS build of pnpm: the runner image lacks libatomic, which the
      # standalone binary from pnpm/action-setup needs. The store stays on the
      # self-hosted runner between runs, so no extra cache step.
      - name: Install pnpm (version from packageManager)
        run: npm install --global "$(node -p "require('./package.json').packageManager")"

      - name: Install
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Lint and format (Biome)
        run: pnpm biome ci --reporter=github .

      - name: Pick backend API for this branch
        id: api
        run: scripts/resolve-api.sh "${{ github.head_ref || github.ref_name }}" | tee -a "$GITHUB_OUTPUT"

      - name: Sync API contract (/api/v1/openapi.json -> schema.d.ts)
        if: steps.api.outputs.api_live == 'true'
        run: |
          pnpm api:sync --url "${{ steps.api.outputs.api_schema_url }}"
          if ! git diff --quiet -- src/api/schema.d.ts; then
            echo "::warning file=src/api/schema.d.ts::Backend '${{ steps.api.outputs.api_branch }}' changed the API. Run 'pnpm api:sync' locally and commit src/api/schema.d.ts."
            git --no-pager diff --stat -- src/api/schema.d.ts
          fi

      - name: Keep committed API contract
        if: steps.api.outputs.api_live != 'true'
        run: echo "::warning::No backend deployment answered; using the committed src/api/schema.d.ts."

      - name: Types
        run: pnpm tsc -b

      - name: Architecture tests
        run: pnpm test:arch

      - name: Unit tests
        run: pnpm test

      - name: Say why there is no preview
        if: >-
          github.event_name == 'pull_request' && vars.PREVIEW_DEPLOYS != 'true' &&
          !contains(github.event.pull_request.labels.*.name, 'preview')
        run: echo 'Preview disabled (PREVIEW_DEPLOYS=false); add label `preview` to deploy' >> "$GITHUB_STEP_SUMMARY"

  build:
    name: build
    # Same condition as the deploy job, so a build never runs without a deploy to feed.
    if: >-
      (github.event.action != 'labeled' || github.event.label.name == 'preview') &&
      ((github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'develop')) ||
       (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository &&
        github.head_ref != 'develop' && github.head_ref != 'main' &&
        (vars.PREVIEW_DEPLOYS == 'true' || contains(github.event.pull_request.labels.*.name, 'preview'))))
    runs-on: [self-hosted, hackathon]
    timeout-minutes: 15
    outputs:
      api_url: ${{ steps.api.outputs.api_url }}
      api_live: ${{ steps.api.outputs.api_live }}
      api_branch: ${{ steps.api.outputs.api_branch }}
      app_env: ${{ steps.api.outputs.app_env }}
      preview_worker: ${{ steps.api.outputs.preview_worker }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      # The JS build of pnpm: the runner image lacks libatomic, which the
      # standalone binary from pnpm/action-setup needs. The store stays on the
      # self-hosted runner between runs, so no extra cache step.
      - name: Install pnpm (version from packageManager)
        run: npm install --global "$(node -p "require('./package.json').packageManager")"

      - name: Install
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Pick backend API for this branch
        id: api
        run: scripts/resolve-api.sh "${{ github.head_ref || github.ref_name }}" | tee -a "$GITHUB_OUTPUT"

      - name: Sync API contract (/api/v1/openapi.json -> schema.d.ts)
        if: steps.api.outputs.api_live == 'true'
        run: |
          pnpm api:sync --url "${{ steps.api.outputs.api_schema_url }}"
          if ! git diff --quiet -- src/api/schema.d.ts; then
            echo "::warning file=src/api/schema.d.ts::Backend '${{ steps.api.outputs.api_branch }}' changed the API. Run 'pnpm api:sync' locally and commit src/api/schema.d.ts."
            git --no-pager diff --stat -- src/api/schema.d.ts
          fi

      - name: Keep committed API contract
        if: steps.api.outputs.api_live != 'true'
        run: echo "::warning::No backend deployment answered; using the committed src/api/schema.d.ts."

      - name: Build
        run: pnpm exec vite build
        # No API URL in the bundle: the app calls /api/v1 on its own origin and
        # the Worker proxies it (API_ORIGIN, see wrangler.jsonc and the deploy job).
        env:
          VITE_APP_ENV: ${{ steps.api.outputs.app_env }}
          VITE_AUTH0_DOMAIN: ${{ vars.AUTH0_DOMAIN }}
          VITE_AUTH0_CLIENT_ID: ${{ vars.AUTH0_CLIENT_ID }}
          VITE_AUTH0_AUDIENCE: ${{ vars.AUTH0_AUDIENCE }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist
          retention-days: 3

  deploy:
    name: deploy
    needs: [verify, build]
    # Pushes to main/develop deploy; pull requests from this repo get a preview,
    # except release PRs (develop -> main): develop already has its own deployment.
    if: >-
      always() && !cancelled() && !contains(needs.*.result, 'failure') && (
      (github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'develop')) ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository &&
       github.head_ref != 'develop' && github.head_ref != 'main' &&
       (vars.PREVIEW_DEPLOYS == 'true' || contains(github.event.pull_request.labels.*.name, 'preview'))))
    runs-on: [self-hosted, hackathon]
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      GH_TOKEN: ${{ github.token }}
      PREVIEW_WORKER: ${{ needs.build.outputs.preview_worker }}
      API_ORIGIN: ${{ needs.build.outputs.api_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      # The JS build of pnpm: the runner image lacks libatomic, which the
      # standalone binary from pnpm/action-setup needs. The store stays on the
      # self-hosted runner between runs, so no extra cache step.
      - name: Install pnpm (version from packageManager)
        run: npm install --global "$(node -p "require('./package.json').packageManager")"
      - name: Install
        run: pnpm install --frozen-lockfile --prefer-offline
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      - name: Check Cloudflare credentials
        id: creds
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN secret or CLOUDFLARE_ACCOUNT_ID variable missing, skipping deploy."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Pick wrangler command
        id: cmd
        if: steps.creds.outputs.ok == 'true'
        run: |
          case "${{ github.event_name }}/${{ github.ref_name }}" in
            push/main) echo "command=deploy" >> "$GITHUB_OUTPUT"
                       echo "url=https://tuttitrip.gburek.app" >> "$GITHUB_OUTPUT" ;;
            push/develop) echo "command=deploy --env develop" >> "$GITHUB_OUTPUT"
                          echo "url=https://tuttitrip-develop.gburek.app" >> "$GITHUB_OUTPUT" ;;
            # main/develop take API_ORIGIN from wrangler.jsonc; a preview proxies to
            # the backend resolve-api.sh picked (same branch, else develop, else main).
            *) echo "command=deploy --env preview --name $PREVIEW_WORKER --var API_ORIGIN:$API_ORIGIN" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Make sure the custom domain is ours to deploy
        if: steps.creds.outputs.ok == 'true' && github.event_name == 'push'
        run: |
          case "${{ github.ref_name }}" in
            main) node scripts/check-custom-domain.mjs tuttitrip-frontend tuttitrip.gburek.app ;;
            develop) node scripts/check-custom-domain.mjs tuttitrip-frontend-develop tuttitrip-develop.gburek.app ;;
          esac

      - name: Deploy to Cloudflare Workers
        id: wrangler
        if: steps.creds.outputs.ok == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
          command: ${{ steps.cmd.outputs.command }} --message "${{ github.sha }}"

      - name: Attach the preview domain
        if: steps.creds.outputs.ok == 'true' && github.event_name == 'pull_request'
        run: node scripts/attach-domain.mjs "$PREVIEW_WORKER" "$PREVIEW_WORKER.gburek.app"

      - name: Deployment URL
        id: url
        if: steps.creds.outputs.ok == 'true'
        run: echo "url=${{ steps.cmd.outputs.url || format('https://{0}.gburek.app', needs.build.outputs.preview_worker) }}" >> "$GITHUB_OUTPUT"

      - name: Smoke test (app shell + SPA deep link + missing asset 404 + API proxy)
        if: steps.creds.outputs.ok == 'true'
        env:
          # A preview whose backend did not answer at build time skips the proxy check.
          CHECK_API: ${{ github.event_name == 'push' || needs.build.outputs.api_live == 'true' }}
        run: |
          url="${{ steps.url.outputs.url }}"
          app_ok() {
            # A build file that does not exist must be a real 404, never index.html.
            [ "$(curl -s -o /dev/null -w '%{http_code}' "$url/assets/smoke-missing.js")" = 404 ] &&
              curl -fsS "$url/" | grep -q '<div id="root">' &&
              curl -fsS -H 'Sec-Fetch-Mode: navigate' "$url/trips?sort=name" | grep -q '<div id="root">' &&
              curl -fsS "$url/trips?sort=name" | grep -q '<div id="root">' &&
              robots_ok
          }
          # Only main may be indexed: everywhere else robots.txt is closed and pages say noindex.
          robots_ok() {
            if [ "${{ github.ref_name }}" = main ]; then
              curl -fsS "$url/robots.txt" | grep -q '^Allow: /'
            else
              curl -fsS "$url/robots.txt" | grep -q '^Disallow: /$' &&
                curl -fsSI "$url/about" | grep -qi '^x-robots-tag: noindex'
            fi
          }
          # /api must reach the backend, never the SPA fallback (index.html).
          api_ok() {
            [ "$CHECK_API" != true ] ||
              curl -fsS -H 'Sec-Fetch-Mode: navigate' "$url/api/v1/health/live" | grep -q '"status":"ok"'
          }
          for _ in $(seq 20); do
            if app_ok && api_ok; then echo "OK: $url (API proxy checked: $CHECK_API)"; exit 0; fi
            sleep 6
          done
          echo "::error::$url did not serve the app and the /api proxy"; exit 1

      - name: Comment preview URL on the PR
        if: steps.creds.outputs.ok == 'true' && github.event_name == 'pull_request'
        run: |
          cat > "$RUNNER_TEMP/comment.md" <<MD
          ### Podgląd: ${{ steps.url.outputs.url }}

          | | |
          | --- | --- |
          | Commit | \`${{ github.event.pull_request.head.sha }}\` |
          | Worker | \`$PREVIEW_WORKER\` |
          | API | ${{ needs.build.outputs.api_url }} (backend \`${{ needs.build.outputs.api_branch }}\`) |

          Podgląd zniknie automatycznie po usunięciu gałęzi.
          MD
          node scripts/pr-comment.mjs --pr "${{ github.event.pull_request.number }}" --body "$RUNNER_TEMP/comment.md"

      - name: Explain the missing preview on the PR
        if: steps.creds.outputs.ok != 'true' && github.event_name == 'pull_request'
        run: |
          printf '### Podgląd niedostępny\n\nCI nie ma danych dostępowych do Cloudflare (sekret `CLOUDFLARE_API_TOKEN` albo zmienna `CLOUDFLARE_ACCOUNT_ID`), więc nie wdrożył `%s`. Build i testy przeszły.\n' \
            "$PREVIEW_WORKER" > "$RUNNER_TEMP/comment.md"
          node scripts/pr-comment.mjs --pr "${{ github.event.pull_request.number }}" --body "$RUNNER_TEMP/comment.md"

      - name: Delete previews of deleted branches
        if: steps.creds.outputs.ok == 'true'
        run: node scripts/cleanup-previews.mjs
