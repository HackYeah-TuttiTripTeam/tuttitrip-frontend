<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>TuttiTrip</title>
    <meta name="description" content="%DESCRIPTION_PL%" />

    <link rel="icon" href="/favicon.svg" sizes="any" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/icon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />

    <!-- Browser chrome follows the theme in use; the script below picks data-light or data-dark. -->
    <meta name="theme-color" content="#f7fcf9" data-light="#f7fcf9" data-dark="#080f0c" />

    <!-- Theme (#97): before first paint, set `.dark`, color-scheme and theme-color from the
         saved choice (`tuttitrip-theme`: light | dark | system), else the system setting.
         Keep in sync with src/lib/theme.ts, which takes over once the app is running. -->
    <script>
      ;(() => {
        let dark = window.matchMedia('(prefers-color-scheme: dark)').matches
        try {
          const saved = localStorage.getItem('tuttitrip-theme')
          if (saved === 'light' || saved === 'dark') dark = saved === 'dark'
        } catch {}
        const root = document.documentElement
        root.classList.toggle('dark', dark)
        root.style.colorScheme = dark ? 'dark' : 'light'
        const meta = document.querySelector('meta[name="theme-color"]')
        if (meta) meta.content = meta.dataset[dark ? 'dark' : 'light']
      })()
    </script>

    <!-- Language (#74): this file is the same for everyone, so before first paint set <html lang>
         and the description to what the app will use: ?lang=, the saved choice (Paraglide's
         localStorage key), then the browser's languages, else Polish. Keep in sync with
         i18n.config.mjs and src/lib/seo.ts (requestLocale). The Worker sets both itself on the
         public pages, from ?lang= and Accept-Language. -->
    <script>
      ;(() => {
        const text = { pl: '%DESCRIPTION_PL%', en: '%DESCRIPTION_EN%' }
        let lang = new URLSearchParams(location.search).get('lang')
        if (!text[lang]) {
          try {
            lang = localStorage.getItem('PARAGLIDE_LOCALE')
          } catch {}
        }
        if (!text[lang]) {
          lang = (navigator.languages || []).map((l) => l.split('-')[0].toLowerCase()).find((l) => text[l])
        }
        if (!text[lang]) return
        document.documentElement.lang = lang
        document.querySelector('meta[name="description"]').content = text[lang]
      })()
    </script>

    <!-- "Add to Home Screen": full-screen app on iOS and Android. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="TuttiTrip" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
