<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>TuttiTrip</title>
    <meta name="description" content="Planowanie wyjazdów w grupie: plan, po którym nikt nie czuje, że przegrał." />
    <meta property="og:title" content="TuttiTrip" />
    <meta property="og:description" content="Plan, po którym nikt nie czuje, że przegrał." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og-image-light.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" sizes="any" type="image/svg+xml" />
    <link rel="icon" href="/icon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />

    <!-- Browser chrome follows the light/dark surface of the app (design system background token). -->
    <meta name="theme-color" content="#f7fcf9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#080f0c" media="(prefers-color-scheme: dark)" />

    <!-- Dark theme: the design system switches on the `.dark` class. Set it from the
         system setting before first paint and keep it in sync (no toggle yet). -->
    <script>
      ;(() => {
        const media = window.matchMedia('(prefers-color-scheme: dark)')
        const apply = () => document.documentElement.classList.toggle('dark', media.matches)
        apply()
        media.addEventListener('change', apply)
      })()
    </script>

    <!-- "Add to Home Screen": full-screen app on iOS and Android. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="TuttiTrip" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
